name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# 同一分支/PR 的新运行会取消旧运行，避免重复构建
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则：仅需读取仓库内容
permissions:
  contents: read

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      # action 版本以 commit SHA 固定，防止上游 tag 被篡改（v4.4.0）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # v4.9.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build with Maven
        run: ./mvnw -B --no-transfer-progress clean verify
