name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支/PR 的新运行会取消旧运行，避免重复构建
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则：仅需读取仓库内容
permissions:
  contents: read

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 8：最低支持版本（jdk8 profile 自动激活，javac 8 以 JDK 8 bootclasspath 编译，
        #    是"无 9+ API 泄漏"的最强验证）；17/21：现代 LTS（含 MR-JAR 与 Spotless 验证）
        java: ['8', '17', '21']
    steps:
      # action 版本以 commit SHA 固定，防止上游 tag 被篡改（v7.0.1）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v5.7.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build with Maven
        run: ./mvnw -B --no-transfer-progress clean verify
      - name: Verify generated sources are up to date
        if: matrix.java != '8'
        run: |
          python3 tools/gen-primitives.py
          git diff --exit-code -- src/main/java src/test/java
